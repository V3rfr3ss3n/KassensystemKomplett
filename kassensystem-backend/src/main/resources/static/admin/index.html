<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kassensystem Verwaltung</title>
    <link rel="stylesheet" href="admin.css?v=20261001-2">
</head>
<body>
<header class="topbar">
    <div>
        <h1>Verwaltung</h1>
        <p>Produkte und Lagerbestand</p>
    </div>
    <div class="top-actions">
        <span id="roleBadge" class="role-badge">...</span>
        <details class="settings-menu">
            <summary>⚙ Einstellungen</summary>
            <div class="settings-content">
                <button id="themeButton" type="button">Dunkelmodus</button>
                <button id="logoutButton" type="button">Abmelden</button>
            </div>
        </details>
    </div>
</header>

<main class="shell">
    <section class="list-section" aria-label="Produktliste">
        <h2 id="inventoryTitle" class="list-title">Lagerbestand</h2>
        <div id="inventoryOverview" class="inventory-overview" aria-label="Lagerübersicht">
            <article class="inventory-card">
                <span>Produkte im Sortiment</span>
                <strong id="totalProducts">–</strong>
            </article>
            <article class="inventory-card">
                <span>Verfügbar</span>
                <strong id="availableProducts">–</strong>
            </article>
            <article class="inventory-card inventory-card-warning">
                <span>Nicht auf Lager</span>
                <strong id="outOfStockProducts">–</strong>
            </article>
        </div>
        <div class="toolbar">
            <input id="searchInput" type="search" aria-label="Produkte suchen" placeholder="Produkte suchen …">
            <select id="unitFilter">
                <option value="">Alle Einheiten</option>
                <option value="STUECK">Stück</option>
                <option value="KILOGRAMM">kg</option>
                <option value="LITER">l</option>
                <option value="PACKUNG">Packung</option>
            </select>
            <select id="categoryFilter" aria-label="Kategorie filtern">
                <option value="">Alle Kategorien</option>
            </select>
            <select id="taxFilter">
                <option value="">Alle Steuern</option>
                <option value="19">19 %</option>
                <option value="7">7 %</option>
            </select>
            <label class="checkbox-line">
                <input id="stockFilter" type="checkbox">
                verfügbar
            </label>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Kategorie</th>
                    <th>Preis</th>
                    <th>Lagerbestand</th>
                    <th>Einheit</th>
                    <th>USt</th>
                </tr>
                </thead>
                <tbody id="productRows"></tbody>
            </table>
        </div>
    </section>

    <aside class="editor" aria-label="Verwaltung">
        <details id="productEditorPanel" class="editor-panel" open>
            <summary id="productEditorTitle">Neues Produkt</summary>
            <form id="productForm">
                <input id="productId" type="hidden">

                <label>
                    Name
                    <input id="nameInput" name="name" required>
                </label>
                <label>
                    Kategorie
                    <input id="categoryInput" name="kategorie" maxlength="60" placeholder="z. B. Obst oder Elektronik" list="knownCategories">
                    <datalist id="knownCategories"></datalist>
                </label>

                <div class="field-grid">
                    <label>
                        Preis
                        <input id="priceInput" name="preis" inputmode="decimal" required>
                    </label>
                    <label>
                        Lagerbestand
                        <input id="stockInput" name="lagerbestand" inputmode="decimal" required>
                    </label>
                </div>

                <div class="field-grid">
                    <label>
                        Einheit
                        <select id="unitInput" name="einheit">
                            <option value="STUECK">Stück</option>
                            <option value="KILOGRAMM">kg</option>
                            <option value="LITER">l</option>
                            <option value="PACKUNG">Packung</option>
                        </select>
                    </label>
                    <label>
                        USt
                        <select id="taxInput" name="steuerSatz">
                            <option value="19">19 %</option>
                            <option value="7">7 %</option>
                        </select>
                    </label>
                </div>

                <label>
                    Produktbild hochladen
                    <input id="imageFile" type="file" accept="image/png,image/jpeg,image/gif">
                </label>
                <img id="imagePreview" class="image-preview" alt="Vorschau des Produktbilds" hidden>
                <label>
                    Bild-URL oder Bildpfad
                    <input id="imageInput" name="bildPfad" placeholder="Optional; beim Hochladen automatisch ausgefüllt">
                </label>

                <div class="button-row">
                    <button id="newProductButton" type="button" hidden>Neues Produkt anlegen</button>
                    <button id="saveButton" class="primary" type="submit">Speichern</button>
                    <button id="deleteButton" class="danger" type="button">Löschen</button>
                </div>
            </form>
        </details>

        <details id="stockPanel" class="stock-box">
            <summary>Warenzugang</summary>
            <div class="stock-content">
                <div id="selectedProductSummary" class="selected-product">Kein Produkt ausgewählt</div>
                <label>
                    Menge
                    <input id="stockAddInput" inputmode="decimal" placeholder="Menge">
                </label>
                <button id="stockAddButton" class="primary" type="button">Warenzugang buchen</button>
            </div>
        </details>

        <p id="statusText" role="status"></p>
    </aside>
</main>

<script src="admin.js?v=20261001-2"></script>
</body>
</html>
