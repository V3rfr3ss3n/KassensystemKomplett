<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kassensystem Verwaltung</title>
    <link rel="stylesheet" href="admin.css?v=20260929-1">
</head>
<body>
<header class="topbar">
    <div>
        <h1>Verwaltung</h1>
        <p>Produkte und Lagerbestand</p>
    </div>
    <div class="top-actions">
        <span id="roleBadge" class="role-badge">...</span>
        <button id="themeButton" type="button">Darkmode</button>
        <button id="reloadButton" type="button">Aktualisieren</button>
        <button id="newButton" type="button">Neu</button>
        <button id="logoutButton" type="button">Logout</button>
    </div>
</header>

<main class="shell">
    <section class="list-section" aria-label="Produktliste">
        <div id="inventoryOverview" class="inventory-overview" aria-label="Lageruebersicht">
            <article class="inventory-card">
                <span>Produkte im Sortiment</span>
                <strong id="totalProducts">–</strong>
            </article>
            <article class="inventory-card">
                <span>Verfuegbar</span>
                <strong id="availableProducts">–</strong>
            </article>
            <article class="inventory-card inventory-card-warning">
                <span>Nicht auf Lager</span>
                <strong id="outOfStockProducts">–</strong>
            </article>
        </div>
        <div class="toolbar">
            <input id="searchInput" type="search" aria-label="Produkte suchen" placeholder="Produkte suchen …">
            <select id="unitFilter">
                <option value="">Alle Einheiten</option>
                <option value="STUECK">Stueck</option>
                <option value="KILOGRAMM">kg</option>
                <option value="LITER">l</option>
                <option value="PACKUNG">Packung</option>
            </select>
            <select id="taxFilter">
                <option value="">Alle Steuern</option>
                <option value="19">19 %</option>
                <option value="7">7 %</option>
            </select>
            <label class="checkbox-line">
                <input id="stockFilter" type="checkbox">
                verfuegbar
            </label>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Preis</th>
                    <th>Lager</th>
                    <th>Einheit</th>
                    <th>USt</th>
                </tr>
                </thead>
                <tbody id="productRows"></tbody>
            </table>
        </div>
    </section>

    <aside class="editor" aria-label="Verwaltung">
        <section id="productEditorPanel" class="editor-panel">
            <h2>Produktdaten</h2>
            <form id="productForm">
                <input id="productId" type="hidden">

                <label>
                    Name
                    <input id="nameInput" name="name" required>
                </label>

                <div class="field-grid">
                    <label>
                        Preis
                        <input id="priceInput" name="preis" inputmode="decimal" required>
                    </label>
                    <label>
                        Lager
                        <input id="stockInput" name="lagerbestand" inputmode="decimal" required>
                    </label>
                </div>

                <div class="field-grid">
                    <label>
                        Einheit
                        <select id="unitInput" name="einheit">
                            <option value="STUECK">Stueck</option>
                            <option value="KILOGRAMM">kg</option>
                            <option value="LITER">l</option>
                            <option value="PACKUNG">Packung</option>
                        </select>
                    </label>
                    <label>
                        USt
                        <select id="taxInput" name="steuerSatz">
                            <option value="19">19 %</option>
                            <option value="7">7 %</option>
                        </select>
                    </label>
                </div>

                <label>
                    Bildpfad
                    <input id="imageInput" name="bildPfad">
                </label>

                <div class="button-row">
                    <button id="saveButton" class="primary" type="submit">Speichern</button>
                    <button id="deleteButton" class="danger" type="button">Loeschen</button>
                </div>
            </form>
        </section>

        <section id="stockPanel" class="stock-box">
            <h2>Warenzugang</h2>
            <div id="selectedProductSummary" class="selected-product">Kein Produkt ausgewaehlt</div>
            <label>
                Menge
                <input id="stockAddInput" inputmode="decimal" placeholder="Menge">
            </label>
            <button id="stockAddButton" class="primary" type="button">Warenzugang buchen</button>
        </section>

        <p id="statusText" role="status"></p>
    </aside>
</main>

<script src="admin.js?v=20260929-1"></script>
</body>
</html>
