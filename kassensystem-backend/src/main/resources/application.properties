# Spring Boot Kassensystem Backend Configuration

# Server
server.port=8080
server.servlet.context-path=/kassensystem

# Anwendung
spring.application.name=Kassensystem Backend

# Logging
logging.level.root=INFO
logging.level.de.mmbbs=DEBUG

# Datenbank (SQLite)
spring.datasource.url=jdbc:sqlite:${kassensystem.db.path:../data/kassensystem.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Jackson JSON
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Europe/Berlin
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
