# Spring Boot Kassensystem Backend Configuration

# Server
server.port=8080
server.servlet.context-path=/kassensystem

# Anwendung
spring.application.name=Kassensystem Backend

# Logging
logging.level.root=INFO
logging.level.de.mmbbs=DEBUG

# Datenbank (SQLite)
spring.datasource.url=jdbc:sqlite:kassensystem.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Europe/Berlin
