name: Quality Gate
on:
  push:
    branches: [main, lf9-api-docker-ci]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Tests und Coverage-Gate
        run: mvn -B verify
      - name: Browser-JavaScript pruefen
        run: node --check kassensystem-backend/src/main/resources/static/admin/admin.js
      - name: Docker-Image bauen
        run: docker build -t kassensystem-backend:ci .
      - name: Coverage-Berichte archivieren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore
