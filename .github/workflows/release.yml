name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - run: mvn -B verify
      - name: Bei Tag in GitHub Container Registry anmelden
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Name vorbereiten
        if: startsWith(github.ref, 'refs/tags/')
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: startsWith(github.ref, 'refs/tags/')
      - name: Backend-Image auf GitHub veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - run: mvn -B verify
      - name: Laufzeitbibliotheken kopieren
        run: mvn -B -pl kassensystem-javafx dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/package-input
      - name: Desktop-App paketieren
        shell: pwsh
        run: |
          Copy-Item kassensystem-javafx/target/kassensystem-javafx-1.0-SNAPSHOT.jar kassensystem-javafx/target/package-input/
          jpackage --type app-image --name Kassensystem --input kassensystem-javafx/target/package-input --dest dist --main-jar kassensystem-javafx-1.0-SNAPSHOT.jar --main-class de.mmbbs.kassensystem.Main --java-options "-Dfile.encoding=UTF-8"
          Compress-Archive -Path dist/Kassensystem -DestinationPath dist/Kassensystem-Windows.zip
      - name: Download als Workflow-Artefakt
        uses: actions/upload-artifact@v7
        with:
          name: Kassensystem-Windows
          path: dist/Kassensystem-Windows.zip
      - name: Download als GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Kassensystem-Windows.zip
          generate_release_notes: true
